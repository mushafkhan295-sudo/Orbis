<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Orbitals — Dark Moon</title>
    <meta name="description" content="A dark lunar mission interactive hero with a 3D perspective card carousel floating over an animated moonscape, orbit-line decorations, and condensed typography." />
    <meta property="og:title" content="Orbitals — Dark Moon" />
    <meta property="og:description" content="A dark lunar mission interactive hero with a 3D perspective card carousel floating over an animated moonscape, orbit-line decorations, and condensed typography." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/assets/fonts/saira-extra-condensed-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/saira-extra-condensed-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/dm-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/dm-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/assets/js/intro.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="stage" id="scene" aria-hidden="true">
        <div class="bg"></div>
        <div class="haze"></div>
        <div class="vig"></div>
      </div>

      <div class="stage" id="deck" role="region" aria-label="Map carousel, drag to browse">
        <svg id="rings" width="1280" height="800" viewBox="0 0 1280 800">
          <defs>
            <linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="260">
              <stop offset="0" stop-color="#e7a57b" stop-opacity=".24" />
              <stop offset=".45" stop-color="#ef8a4d" stop-opacity=".5" />
              <stop offset="1" stop-color="#f27a37" stop-opacity=".72" />
            </linearGradient>
            <linearGradient id="gG" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="260">
              <stop offset="0" stop-color="#c3d0e0" stop-opacity=".07" />
              <stop offset="1" stop-color="#c3d0e0" stop-opacity=".32" />
            </linearGradient>
          </defs>
          <g id="ringpaths" fill="none"></g>
          <g id="ringdots"></g>
        </svg>
        <div id="cards"></div>
        <div id="deckhit"></div>
      </div>

      <div class="rule" id="rule"></div>

      <div class="grp" id="g-tl">
        <a class="logo" href="#" aria-label="Orbitals home">
          <span class="tx" style="left:40px;top:37px;font-size:37.225px;letter-spacing:7px;transform:scaleX(.7156)">ORBITALS</span>
        </a>
      </div>

      <div class="grp" id="g-tc">
        <nav class="nav" id="nav" aria-label="Primary">
          <a class="tx" id="n1" href="#" style="left:474px;transform:scaleX(.782)">MISSION</a>
          <a class="tx" id="n2" href="#" style="left:574px;transform:scaleX(.7714)">RADAR</a>
          <a class="tx" id="n3" href="#" style="left:660px;transform:scaleX(.8)">DOCKS</a>
          <a class="tx" id="n4" href="#" style="left:747px;transform:scaleX(.7941)">UPLINK</a>
        </nav>
      </div>

      <div class="grp" id="g-tr">
        <button class="burger" id="burger" type="button" aria-controls="nav" aria-expanded="false" aria-label="Open menu">
          <i></i><i></i>
        </button>
      </div>

      <div class="grp" id="g-r">
        <button class="arrow next" type="button" aria-label="Next map">
          <svg viewBox="-12 -12 24 24" width="24" height="24" aria-hidden="true">
            <path d="M-2.8 -4 L4.4 0 L-2.8 4Z" fill="#eeeeee" />
          </svg>
        </button>
        <button class="arrow prev" type="button" aria-label="Previous map">
          <svg viewBox="-12 -12 24 24" width="24" height="24" aria-hidden="true">
            <path d="M2.8 -4 L-4.4 0 L2.8 4Z" fill="#eeeeee" />
          </svg>
        </button>
      </div>

      <div class="grp" id="g-bl">
        <div class="shade"></div>
        <i class="odot"></i>
        <div class="pill" id="pill"></div>
        <div class="mask" id="m-top">
          <span class="tx disp" id="t-top" style="left:156px;top:4px;font-size:34.3px;letter-spacing:.4px;transform:scaleX(.75)">TOP</span>
        </div>
        <div class="mask" id="m-tag">
          <span class="tx" id="t-tag" style="left:212px;top:7.5px;font-size:12.8px;letter-spacing:.291px">STARVOYAGERS</span>
        </div>
        <div class="mask" id="m-title">
          <span class="tx disp" id="t-title" style="left:126px;top:-7px;font-size:130px;letter-spacing:1.5px;transform:scaleX(.6988)">DARK MOON</span>
        </div>
        <div class="mask" id="m-desc">
          <span class="tx desc" id="t-desc" style="left:127px;top:7px;font-size:12.6px;letter-spacing:.475px">DARK MOON IS A SKY PLATFORM BUILT FOR THE FAR, WITH SUPPORT FOR ORBITALS</span>
        </div>
        <a class="btn" id="btn" href="#">
          <span class="tx" style="left:180px;top:726px;font-size:12.8px;letter-spacing:.4px">ASCEND</span>
        </a>
      </div>

      <div class="grp" id="g-br">
        <a class="see" href="#">
          <span class="tx mono" style="left:1020px;top:666px;font-size:14px;letter-spacing:.762px">SEE ALL MAPS</span>
          <svg viewBox="0 0 8 9" width="7.4" height="9" aria-hidden="true">
            <path d="M0 0 L8 4.5 L0 9Z" fill="#ffffff" />
          </svg>
        </a>
        <div id="thumbs"></div>
      </div>

      <div class="dcur" id="dcur" aria-hidden="true">
        <svg viewBox="0 0 26 12" width="26" height="12" aria-hidden="true">
          <path d="M0.5 6 L9 0.8 L9 11.2Z M25.5 6 L17 0.8 L17 11.2Z" fill="#ffffff" />
        </svg>
      </div>
      <i id="safe" aria-hidden="true"></i>
    </div>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
